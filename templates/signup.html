{% extends "base.html" %}
{% block title %}Sign up — Skill Stack{% endblock %}
{% block content %}
<div class="auth-screen">
  <div class="auth-card">
    <div class="brand">Skill<span>Stack</span></div>
    <h1>Create your account</h1>
    <p class="auth-sub">One dashboard for your LeetCode, GitHub, and CodeChef progress.</p>

    <form method="POST" action="{{ url_for('signup') }}" class="auth-form">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" required placeholder="e.g. Veer Narayan" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="At least 6 characters" />
      </div>
      <div class="field">
        <label for="confirm_password">Confirm password</label>
        <input type="password" id="confirm_password" name="confirm_password" required placeholder="Re-enter password" />
      </div>
      <button type="submit" class="btn-primary">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
